name: Release

# Pushing a tag like v0.2.0 builds both platforms and publishes them as a GitHub Release.
# Running it by hand (Actions tab → Release → Run workflow) only builds, for testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      # The xcb packages are needed so linuxdeploy can bundle Qt's X11 platform plugin.
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-shape0

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOMIT_TOOLS_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          OUTPUT: vomit-tools-x86_64.AppImage
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLO $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          cat > vomit-tools.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=vomit-tools
          Comment=Soundscape, skybox and particle editors for Source engine games
          Exec=vomit-tools
          Icon=vomit-tools
          Categories=Development;Game;
          EOF

          # Placeholder icon until the project has a real one.
          cat > vomit-tools.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#4a7a3a"/><text x="32" y="44" font-family="sans-serif" font-size="32" font-weight="bold" fill="#fff" text-anchor="middle">vt</text></svg>
          EOF

          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/src/app/vomit-tools \
            --desktop-file vomit-tools.desktop \
            --icon-file vomit-tools.svg \
            --plugin qt --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: vomit-tools-x86_64.AppImage

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DVOMIT_TOOLS_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel

      # The install step runs windeployqt, which copies the Qt DLLs next to the exe. The MSVC
      # runtime DLLs are copied too, so it runs on PCs without the Visual C++ Redistributable.
      - name: Package zip
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix vomit-tools
          $bin = Get-ChildItem vomit-tools -Recurse -Filter vomit-tools.exe | Select-Object -First 1
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $bin.DirectoryName
          }
          Compress-Archive -Path vomit-tools -DestinationPath vomit-tools-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: vomit-tools-windows-x64.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            vomit-tools-x86_64.AppImage
            vomit-tools-windows-x64.zip
          generate_release_notes: true
